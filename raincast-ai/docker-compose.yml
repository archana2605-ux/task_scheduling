version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/cache:/app/cache
      - ./backend/raincast.db:/app/raincast.db
    environment:
      - DEBUG=false
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
      - ECMWF_TIMEOUT=300
      - ECMWF_MAX_RETRIES=3
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
