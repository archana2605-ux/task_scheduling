<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TaskFlow Pro{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Animated background orbs -->
    <div class="bg-animation">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>

    <!-- Navigation -->
    <nav class="glass-nav">
        <div class="nav-brand">
            <span class="brand-icon">⚡</span>
            <span class="brand-text">TaskFlow Pro</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
                <span>📊</span> Dashboard
            </a>
            <a href="/kanban" class="nav-link {% if active_page == 'kanban' %}active{% endif %}">
                <span>📋</span> Kanban
            </a>
            <a href="/analytics" class="nav-link {% if active_page == 'analytics' %}active{% endif %}">
                <span>📈</span> Analytics
            </a>
            <a href="/logs" class="nav-link {% if active_page == 'logs' %}active{% endif %}">
                <span>📝</span> Logs
            </a>
            <a href="/business" class="nav-link {% if active_page == 'business' %}active{% endif %}">
                <span>💼</span> Business
            </a>
        </div>
        <div class="nav-actions">
            <button id="theme-toggle" class="btn-icon" title="Toggle theme">
                <span class="theme-icon">🌙</span>
            </button>
        </div>
    </nav>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <!-- Flash messages trigger toasts -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            {% for category, message in messages %}
            showToast('{{ message | e }}', '{{ category }}');
            {% endfor %}
        });
    </script>
    {% endif %}
    {% endwith %}

    <!-- Main content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
