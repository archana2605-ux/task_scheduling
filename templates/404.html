{% extends "base.html" %}

{% block title %}404 — Not Found{% endblock %}

{% block content %}
<div class="empty-state glass-card" style="padding: 80px 20px;">
    <div class="empty-icon">🛸</div>
    <h1 style="font-size: 32px; margin-top: 10px;">Page Not Found</h1>
    <p style="margin-top: 12px; color: var(--text-secondary);">The requested resource or task does not exist or has been moved.</p>
    <div style="margin-top: 24px;">
        <a href="/" class="btn-primary" style="text-decoration: none; display: inline-block;">
            ← Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
